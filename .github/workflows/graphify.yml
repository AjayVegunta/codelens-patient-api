name: Update Graphify

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  graphify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Graphify
        run: pip install graphifyy

      - name: Generate graph
        run: graphify update .

      - name: Prepare artifact
        run: |
          mkdir -p graphify-out
          find . -name graph.json -exec cp {} graphify-out/graph.json \;
          echo "${GITHUB_SHA}" > graphify-out/source_commit.txt

      - name: Upload Graphify artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphify-${{ github.sha }}
          path: graphify-out/
